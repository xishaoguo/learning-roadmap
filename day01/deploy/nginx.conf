server {
  listen 80;
  server_name zufang.2xiao.xyz;
  root /var/www/zufang/h5;
  index index.html;
  location / { try_files $uri $uri/ /index.html; }
  location /api/ { proxy_pass http://127.0.0.1:3000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
  location /uploads/ { proxy_pass http://127.0.0.1:3000; }
}
server {
  listen 80;
  server_name zufang.manage.2xiao.xyz;
  root /var/www/zufang/admin;
  index index.html;
  location / { try_files $uri $uri/ /index.html; }
  location /api/ { proxy_pass http://127.0.0.1:3000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
  location /uploads/ { proxy_pass http://127.0.0.1:3000; }
}
