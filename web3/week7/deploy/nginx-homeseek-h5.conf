server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name h5.erxiaoyihao.com;

    ssl_certificate /etc/letsencrypt/live/h5.erxiaoyihao.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/h5.erxiaoyihao.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/homeseek-h5;
    index index.html;

    location ^~ /week7/ {
        alias /var/www/week7/;
        try_files $uri $uri/ /week7/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|webp|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name h5.erxiaoyihao.com;
    return 301 https://$host$request_uri;
}
